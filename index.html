<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>molokog – Prototipo de alta fidelidad</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1b1b1f;--mut:#5b5b66;--acc:#b93a0b;--onacc:#fff;--line:#d9d4cc;--err:#b00020;--ok:#1b6e3c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1f1f23;--ink:#f2efea;--mut:#b4b0a8;--acc:#ff8a5c;--onacc:#1b1b1f;--line:#3a3a40;--err:#ff8a98;--ok:#6fd49a}}
:root[data-theme="dark"]{--bg:#141416;--card:#1f1f23;--ink:#f2efea;--mut:#b4b0a8;--acc:#ff8a5c;--onacc:#1b1b1f;--line:#3a3a40;--err:#ff8a98;--ok:#6fd49a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
h1{font-size:1.4rem;margin:0;letter-spacing:-.5px}
main{max-width:720px;margin:0 auto;padding:16px 16px 96px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:2px solid var(--acc);background:var(--acc);color:var(--onacc);font-weight:700;cursor:pointer;width:100%}
.btn.sec{background:transparent;color:var(--acc)}
.ib{min-height:48px;min-width:48px;border:0;background:transparent;cursor:pointer;font-weight:700;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;cursor:pointer;width:100%}
.img{height:120px;border-radius:10px;display:grid;place-items:center;font-size:3rem;margin-bottom:8px}
.price{font-weight:700}.mut{color:var(--mut);font-size:.9rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.chip{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.sizes button{min-width:48px;min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.sizes button[aria-checked="true"]{border-color:var(--acc);background:var(--acc);color:var(--onacc)}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 16px}
.steps li{flex:1;height:8px;border-radius:4px;background:var(--line)}.steps li.on{background:var(--acc)}
label{display:block;font-weight:600;margin-top:12px}
input{width:100%;min-height:48px;padding:0 12px;border-radius:10px;border:2px solid var(--line);background:var(--card)}
input[aria-invalid="true"]{border-color:var(--err)}input.good{border-color:var(--ok)}
.msg{min-height:1.2em;font-size:.88rem;color:var(--err);margin:4px 0 0}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar .btn{max-width:688px;display:block;margin:0 auto}
.toast{position:fixed;left:16px;right:16px;bottom:88px;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px}
summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600}
.back{border:2px solid var(--line);border-radius:12px;padding:0 16px;margin-bottom:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>molokog</h1>
  <nav aria-label="Principal">
    <button class="ib" id="goCat" type="button">Catálogo</button>
    <button class="ib" id="goCart" type="button" aria-label="Carrito, 0 artículos">Carrito (<span id="cnt">0</span>)</button>
  </nav>
</header>
<main id="main" tabindex="-1" aria-live="polite"></main>
<div id="toast" class="toast" role="status" hidden></div>
<script>
const P=[
{id:1,n:"Hoodie Oversize",p:699,c:"Sudaderas",e:"🧥",bg:"#e8d5c4",d:"Algodón 80%, corte oversize, capucha doble."},
{id:2,n:"Playera Gráfica",p:349,c:"Playeras",e:"👕",bg:"#cfe3d4",d:"Algodón peinado, estampado serigrafía."},
{id:3,n:"Jogger Cargo",p:799,c:"Pantalones",e:"👖",bg:"#d4d9ee",d:"Bolsillos laterales, cintura elástica."},
{id:4,n:"Gorra Snapback",p:299,c:"Accesorios",e:"🧢",bg:"#f2d6d6",d:"Ajuste trasero, bordado frontal."},
{id:5,n:"Chamarra Bomber",p:1199,c:"Sudaderas",e:"🧥",bg:"#e6e0b8",d:"Forro ligero, puños elásticos."},
{id:6,n:"Playera Básica",p:259,c:"Playeras",e:"👕",bg:"#dcdcdc",d:"Corte regular, 100% algodón."}];
const TELA={1:"80% algodón, 20% poliéster",2:"100% algodón peinado",3:"65% algodón, 35% poliéster",4:"100% algodón",5:"100% nailon, forro de poliéster",6:"100% algodón"};P.forEach(x=>x.t=TELA[x.id]);
const $=s=>document.querySelector(s),M=$("#main"),money=n=>"$"+n.toLocaleString("es-MX")+" MXN";
let sent=false,pm="t",cart=[],cat="Todos",cur=null,size="M",view="cat";
const cnt=()=>cart.reduce((a,i)=>a+i.q,0),total=()=>cart.reduce((a,i)=>a+i.q*i.p,0);
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
function sync(){$("#cnt").textContent=cnt();$("#goCart").setAttribute("aria-label","Carrito, "+cnt()+" artículos")}
function go(v,np){if(v==="pay"&&!cart.length)v="cat";if(v==="det"&&!cur)v="cat";if(!np&&v!==view)history.pushState({v},"");view=v;({cat:rCat,det:rDet,cart:rCart,pay:rPay,ok:rOk})[v]();sync();M.focus();window.scrollTo(0,0)}
function rCat(){
 const cs=["Todos",...new Set(P.map(x=>x.c))];
 M.innerHTML=`<h2>Catálogo</h2><div class="chips" role="group" aria-label="Filtrar por categoría">${cs.map(c=>`<button class="chip" type="button" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("")}</div>
 <div class="grid">${P.filter(x=>cat==="Todos"||x.c===cat).map(x=>`<button class="card" type="button" data-id="${x.id}"><div class="img" role="img" aria-label="${x.n}" style="background:${x.bg}">${x.e}</div><div>${x.n}</div><div class="price">${money(x.p)}</div></button>`).join("")}</div>`;
 M.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.c;go("cat")});
 M.querySelectorAll(".card").forEach(b=>b.onclick=()=>{cur=P.find(x=>x.id==b.dataset.id);size="M";go("det")});
}
function rDet(){
 M.innerHTML=`<button class="ib back" type="button" id="back">← Volver al catálogo</button>
 <div class="img" role="img" aria-label="${cur.n}" style="background:${cur.bg};height:220px;font-size:6rem">${cur.e}</div>
 <h2>${cur.n}</h2><p class="price">${money(cur.p)}</p><p class="mut">${cur.d}</p><p><strong>Composición:</strong> ${cur.t}</p><details><summary>Guía de tallas</summary><p class="mut">S: pecho 92 cm · M: 98 cm · L: 104 cm · XL: 110 cm. Si estás entre dos tallas, elige la mayor. Cambios y devoluciones dentro de 15 días.</p></details>
 <div role="radiogroup" aria-label="Talla" class="row sizes">${["S","M","L","XL"].map(s=>`<button type="button" role="radio" aria-checked="${s===size}" data-s="${s}">${s}</button>`).join("")}</div>
 <div class="bar"><button class="btn" id="add" type="button">Agregar al carrito</button></div>`;
 $("#back").onclick=()=>go("cat");
 M.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{size=b.dataset.s;M.querySelectorAll("[data-s]").forEach(x=>x.setAttribute("aria-checked",x===b))});
 $("#add").onclick=()=>{const k=cur.id+size,f=cart.find(i=>i.k===k);f?f.q++:cart.push({k,n:cur.n,s:size,p:cur.p,q:1});sync();toast(cur.n+" (talla "+size+") agregado al carrito")};
}
function rCart(){
 if(!cart.length){M.innerHTML=`<h2>Carrito</h2><p>Tu carrito está vacío.</p><button class="btn" id="b" type="button">Ver catálogo</button>`;$("#b").onclick=()=>go("cat");return}
 M.innerHTML=`<h2>Carrito</h2>${cart.map((i,x)=>`<div class="line"><div><strong>${i.n}</strong><div class="mut">Talla ${i.s} · ${money(i.p)}</div></div>
 <div><button class="ib" type="button" aria-label="Quitar uno de ${i.n}" data-m="${x}">−</button><span aria-label="Cantidad">${i.q}</span><button class="ib" type="button" aria-label="Agregar uno de ${i.n}" data-p="${x}">+</button></div></div>`).join("")}
 <p class="line"><span>Total</span><strong>${money(total())}</strong></p>
 <div class="bar"><button class="btn" id="pay" type="button">Continuar al pago</button></div>`;
 M.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const i=cart[b.dataset.m];if(--i.q<1)cart.splice(b.dataset.m,1);go("cart")});
 M.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{cart[b.dataset.p].q++;go("cart")});
 $("#pay").onclick=()=>go("pay");
}
const V={nombre:v=>v.trim().length>=3?"":"Escribe tu nombre completo (mínimo 3 letras).",
 correo:v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)?"":"Escribe un correo válido, por ejemplo nombre@correo.com.",
 dir:v=>v.trim().length>=10?"":"Escribe calle, número y colonia (mínimo 10 caracteres).",
 cp:v=>/^\d{5}$/.test(v)?"":"El código postal tiene 5 dígitos."};
function rPay(){sent=false;
 const F=[["nombre","Nombre completo","text","name"],["correo","Correo electrónico","email","email"],["dir","Dirección de entrega","text","street-address"],["cp","Código postal","text","postal-code"]];
 M.innerHTML=`<button class="ib back" type="button" id="back">← Volver al carrito</button><h2>Pago</h2>
 <ol class="steps" aria-label="Paso 2 de 3: datos de entrega"><li class="on"></li><li class="on"></li><li></li></ol><p class="mut">Paso 2 de 3 · Datos de entrega</p>
 <form id="f" novalidate>${F.map(([k,l,t,a])=>`<label for="${k}">${l}</label><input id="${k}" name="${k}" type="${t}" autocomplete="${a}" aria-describedby="e${k}" required><p class="msg" id="e${k}"></p>`).join("")}
 <fieldset style="border:0;padding:0;margin-top:12px"><legend><strong>Método de pago</strong></legend>
 <label><input type="radio" name="m" value="t" checked style="width:auto;min-height:auto"> Tarjeta (se captura en el siguiente paso)</label>
 <label><input type="radio" name="m" value="e" style="width:auto;min-height:auto"> Efectivo en tienda de autoservicio (recibes una referencia)</label></fieldset>
 <p class="mut">Tu pedido se cobra una sola vez. Si algo falla, no se te cobrará de nuevo.</p><p class="line"><span>Total a pagar</span><strong>${money(total())}</strong></p>
 <div class="bar"><button class="btn" type="submit">Confirmar pedido</button></div></form>`;
 $("#back").onclick=()=>go("cart");
 const chk=(k,show)=>{const i=$("#"+k),m=V[k](i.value);i.setAttribute("aria-invalid",!!m&&show);i.classList.toggle("good",!m);$("#e"+k).textContent=show?m:"";return!m};
 F.forEach(([k])=>{const i=$("#"+k);i.addEventListener("input",()=>chk(k,true));i.addEventListener("blur",()=>i.value&&chk(k,true))});
 $("#f").onsubmit=e=>{e.preventDefault();const bad=F.map(([k])=>[k,chk(k,true)]).filter(x=>!x[1]);if(bad.length){$("#"+bad[0][0]).focus();toast("Revisa "+bad.length+" campo(s) marcado(s)");return}if(sent)return;sent=true;pm=document.querySelector("input[name=m]:checked").value;e.submitter&&(e.submitter.disabled=true);go("ok")};
}
function rOk(){const n="MLG-"+Math.floor(1000+Math.random()*9000),t=total(),ref=String(Math.floor(Math.random()*1e12)).padStart(12,"0");cart=[];sync();
 M.innerHTML=`<ol class="steps" aria-label="Paso 3 de 3: confirmación"><li class="on"></li><li class="on"></li><li class="on"></li></ol>
 <h2>¡Pedido confirmado!</h2><p>Tu número de pedido es <strong>${n}</strong>. Total: ${money(t)}.</p>${pm==="e"?`<p>Paga en cualquier tienda de autoservicio con la referencia <strong>${ref}</strong> en un plazo de 48 horas.</p>`:""}<p class="mut">Te enviaremos el seguimiento por correo.</p>
 <button class="btn" id="b" type="button">Seguir comprando</button>`;$("#b").onclick=()=>go("cat")}
$("#goCat").onclick=()=>go("cat");$("#goCart").onclick=()=>go("cart");
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(view==="det"||view==="cart")go("cat");else if(view==="pay")go("cart")}});
history.replaceState({v:"cat"},"");window.addEventListener("popstate",e=>go(e.state&&e.state.v||"cat",true));
go("cat",true);
</script>
</body>
</html>
